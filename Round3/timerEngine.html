<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Tracker Engine</title>
    <link rel="stylesheet" href="timerEngine.css">
</head>
<body>

    <header>

        <div>
            <h1>Timer Engine</h1>
        </div>

    </header>
    <main>
         <div id="timerEngine">
                <p>Hours: <span id="hours">0</span></p>
                <p>Minutes: <span id="minutes">0</span></p>
                <p>seconds: <span id="seconds">0</span></p>

         </div>

          <div class="btn">

            <button id="start">Start</button>

            <button id="pause">Pause</button>

            <button id="currTime">CurrentTime</button>

          </div>

          <div id="current"></div>


          <!-- task assignment -->
           <div class="loggin-tsk">

            
           </div>
         
    </main>


    <script src="timerEngine.js"></script>
</body>
</html>
