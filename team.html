<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Meet The Team</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div id="wrapper">
            <div class="top-bar">
                <div class="logo">Vonnue</div>
                <div class="nav-links">
                    <a href="#team">Team</a>
                    <a href="#contact">Contact</a>
                </div>
            </div>
            <h1>Meet The Team</h1>
            <div class="card-grid">
                <div class="card" id="card1">
                    <img src="alex.jpg" alt="Portrait of Alex">
                    <h2>Alex Chen</h2>
                    <p>Frontend Engineer</p>
                    <div class="tag">Available</div>
                </div>
                <div class="card" id="card2">
                    <img src="priya.jpg" alt="Portrait of Priya Nair">
                    <h2>Priya Nair</h2>
                    <p>UX Designer</p>
                    <div class="tag urgent">Booked</div>
                </div>
                <div class="card" id="card3">
                    <img src="sam.jpg" alt="Portrait of Sam Okafor">
                    <h2>Sam Okafor</h2>
                    <p>Backend Engineer </p>
                    <div class=" tag badge">New</div>
                </div>
            </div>
            <div class="contact-form">
                <h2>Get in touch</h2>
                <form>
                    <label for="name">Name</label>
                    <input type="text" id="name" placeholder="Your name">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Your email">
                    <div class="submit-btn" onclick="alert('Sent!')">Send</div>
                </form>
            </div>
        </div>
    </body>
</html>
